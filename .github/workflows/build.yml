name: Build and release Alpha hack
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: alpha-release-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?per_page=30" --jq '[.workflow_runs[] | select(.name == "Build and release Alpha hack" and .id < ${{ github.run_id }} and .status != "completed") | .id][]' | while read -r run_id; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" || true
          done
      - uses: actions/checkout@v4
      - run: python3 -m json.tool mod.json > /dev/null
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: Win64
          - runner: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        if: matrix.target == 'Android64'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
      - uses: geode-sdk/build-geode-mod@61a56c697aea9655e3f31c6c1b83870431f30434
        with:
          sdk: given
          cli: v4.0.0
          target: ${{ matrix.target }}
          combine: true
          build-config: Release
          ccache-variant: ''
          use-lto: false
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - id: package
        uses: geode-sdk/build-geode-mod/combine@61a56c697aea9655e3f31c6c1b83870431f30434
        with:
          cli: v4.0.0
          zstd: false
          optimize-pngs: false
          delete-artifacts: false
      - name: Verify both binaries
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.build-output }}
        run: |
          mkdir -p dist
          cp "$PACKAGE_DIR/dim5l.practice_sync.geode" dist/Alpha_hack_lite_1.0.0_Universal.geode
          python3 scripts/verify_package.py dist/*.geode
          cd dist
          sha256sum *.geode > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-hack-universal
          path: dist/*
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 dist/* --target "$GITHUB_SHA" --title "Alpha hack lite 1.0.0" --notes-file RELEASE_NOTES.md
